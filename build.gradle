import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

plugins {
	id 'application'
	id 'java'
	id "org.jetbrains.kotlin.jvm" version "$kotlin_version"
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()

}

configurations {
	implementation.extendsFrom(shadow)
}

dependencies {
	implementation(fileTree('libs'))

	// Use newer Log4J because of the RCE (requires java 8 however)
	shadow 'org.apache.logging.log4j:log4j-api:2.17.1'
	shadow 'org.apache.logging.log4j:log4j-core:2.17.1'
	shadow 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'
	shadow 'com.google.code.gson:gson:2.11.0'

	// thanks kami blue :-)
	shadow("org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version") {
		exclude module: 'kotlin-stdlib-common'
		exclude module: 'annotations'
	}

}

application {
	mainClass = 'Start'
}

tasks.register('runClient', JavaExec) {
	group = 'application'
	description = 'Compiles and runs client'

	mainClass = application.mainClass.get()
	classpath = sourceSets.main.runtimeClasspath

	workingDir = file("run")
	jvmArgs = ["-Djava.library.path=../libs/1.7.2-natives"]
}

tasks.withType(JavaCompile).configureEach {
	it.sourceCompatibility = project.properties['java_version']
	it.targetCompatibility = project.properties['java_version']
}

tasks.withType(KotlinJvmCompile).configureEach {
	it.compilerOptions.jvmTarget.set(JvmTarget.JVM_1_8)
}

task sourcesJar(type: Jar, dependsOn: classes) {
	setArchiveClassifier('sources')
	from sourceSets.main.allSource
}

artifacts {
	archives sourcesJar
}


jar {
	from {
		configurations.shadow.collect {
			exclude("META-INF/")
			exclude("dummyThing")
			it.isDirectory() ? it : zipTree(it)
		}

	}
}