import org.gradle.api.internal.file.collections.FileTreeAdapter
import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

plugins {
	id 'application'
	id 'java'
	id 'org.jetbrains.kotlin.jvm' version "$kotlin_version"
	id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
}

dependencies {
	compileOnly fileTree('libs') // Available for compilation but not included in shadowJar

	// Dependencies that WILL be included in shadowJar
	implementation 'org.apache.logging.log4j:log4j-api:2.17.1'
	implementation 'org.apache.logging.log4j:log4j-core:2.17.1'
	implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'
	implementation 'com.google.code.gson:gson:2.11.0'

	// thanks kami blue :-)
	implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version") {
		exclude module: 'kotlin-stdlib-common'
		exclude module: 'annotations'
	}
}

application {
	mainClass = 'Start'
}

tasks.register('runClient', JavaExec) {
	group = 'application'
	description = 'Compiles and runs client'

	mainClass = application.mainClass.get()
	classpath = sourceSets.main.runtimeClasspath + fileTree('libs') // Add libs back for runtime

	workingDir = file("run")
	jvmArgs = ["-Djava.library.path=../libs/1.7.2-natives"]
}

tasks.withType(JavaCompile).configureEach {
	it.sourceCompatibility = project.properties['java_version']
	it.targetCompatibility = project.properties['java_version']
}

tasks.withType(KotlinJvmCompile).configureEach {
	it.compilerOptions.jvmTarget.set(JvmTarget.JVM_1_8)
}

tasks.register('sourcesJar', Jar) {
	dependsOn classes
	setArchiveClassifier('sources')
	from sourceSets.main.allSource
}

tasks.build {
	dependsOn(tasks.shadowJar)
}

shadowJar {
	// Default behavior - will only include implementation dependencies
	// compileOnly dependencies are automatically excluded
}

artifacts {
	archives sourcesJar
}